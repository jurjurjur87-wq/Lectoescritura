<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#6C4AB6">
<title>Lectoescritura</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Andika";src:url("fonts/andika.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Andika";src:url("fonts/andika-bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Playwrite ES";src:url("fonts/playwrite-es.woff2") format("woff2");font-weight:400;font-display:swap}

:root{
  --bg:#FFF8EC; --card:#FFFFFF; --ink:#2B2340; --muted:#6B6380;
  --primary:#6C4AB6; --primary-2:#8E6DE0; --soft:#EFE8FF;
  --ok:#2E9E5B; --ok-soft:#DFF5E7; --bad:#D9534F; --bad-soft:#FDE6E5;
  --warn:#E8A33D; --line:#E6DFF2;
  --radius:22px; --shadow:0 6px 0 rgba(43,35,64,.10), 0 10px 24px rgba(43,35,64,.08);
  --scale:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"Andika",system-ui,sans-serif;color:var(--ink);background:var(--bg);
  font-size:calc(clamp(16px, 0.9vw + 0.6vh, 30px) * var(--scale));
  user-select:none;-webkit-user-select:none;overflow:hidden;
}
body.grande{--scale:1.25}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
input,select,textarea{font-family:inherit;font-size:1em;color:var(--ink);user-select:text;-webkit-user-select:text}
#app{height:100%;display:flex;flex-direction:column}

/* Barra superior */
.top{display:flex;align-items:center;gap:.8em;padding:.7em 1em;min-height:4.2em}
.top h1{font-size:1.5em;margin:0;flex:1;font-weight:700;letter-spacing:.01em}
.top .who{display:flex;align-items:center;gap:.4em;font-size:1.1em;font-weight:700}
.top .who .av{font-size:1.5em}
.iconbtn{width:3em;height:3em;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:1.2em;display:grid;place-items:center;flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(43,35,64,.1)}
.main{flex:1;overflow:auto;padding:0 1.2em 1.2em}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center}

/* Tarjetas grandes */
.grid{display:grid;gap:1em;grid-template-columns:repeat(auto-fill,minmax(11em,1fr))}
.tile{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.2em .8em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;min-height:8em;font-weight:700;font-size:1.1em;text-align:center;position:relative;border:4px solid transparent}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(43,35,64,.1)}
.tile .big{font-size:3em;line-height:1}
.tile small{font-weight:400;color:var(--muted);font-size:.75em}
.group-tile{color:#fff;min-height:9em;font-size:1.3em}
.group-tile .big{font-size:2.6em}

.hero{text-align:center;margin:1em 0 1.4em}
.hero h2{font-size:2em;margin:.2em 0}
.hero p{color:var(--muted);margin:0}

.menu{display:grid;gap:1.4em;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));max-width:60em;margin:0 auto;width:100%}
.menu .tile{min-height:13em;font-size:1.6em}
.menu .tile .big{font-size:2.6em}
.badge{position:absolute;top:.5em;right:.6em;background:var(--soft);color:var(--primary);border-radius:999px;padding:.15em .6em;font-size:.6em;font-weight:700}

/* Abecedario */
.abc{display:grid;gap:.8em;grid-template-columns:repeat(auto-fill,minmax(5.5em,1fr));max-width:80em;margin:0 auto}
.abc .tile{min-height:6.5em;padding:.5em;font-weight:400}
.abc .tile .big{font-size:2.8em;color:var(--primary)}
.abc .tile.done{border-color:#F6C945;background:#FFFBEA}
.abc .star{position:absolute;top:.25em;right:.35em;font-size:.9em}
.abc .tile.off{opacity:.35;pointer-events:none}

/* Elegir respuesta */
.prompt{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.2em;display:flex;align-items:center;justify-content:center;gap:1em;min-height:10em;margin:0 auto 1.4em;max-width:60em;width:100%;flex-wrap:wrap}
.prompt .emoji{font-size:6em;line-height:1}
.prompt .phrase{font-size:2.6em}
.prompt .ask{font-size:1.4em;color:var(--muted)}
.speak{width:4.2em;height:4.2em;border-radius:50%;background:var(--primary);color:#fff;font-size:1.4em;box-shadow:0 6px 0 #4E3290;flex:none}
.speak:active{transform:translateY(4px);box-shadow:0 2px 0 #4E3290}
.options{display:grid;gap:1.2em;grid-template-columns:repeat(3,1fr);max-width:60em;margin:0 auto;width:100%}
.opt{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);min-height:7em;font-size:3em;display:grid;place-items:center;border:5px solid transparent;padding:.2em}
.opt.emo{font-size:4.5em}
.opt:active{transform:translateY(4px)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.progress-dots{display:flex;gap:.5em;justify-content:center;margin:0 0 1em}
.progress-dots span{width:1em;height:1em;border-radius:50%;background:var(--line)}
.progress-dots span.on{background:var(--primary)}

/* Trazado */
.trace-wrap{display:flex;gap:1em;height:100%;min-height:0}
.trace-side{width:15em;flex:none;display:flex;flex-direction:column;gap:1em}
.side-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:1em;text-align:center}
.side-card .emoji{font-size:5em;line-height:1.1}
.side-card .word{font-size:1.6em;font-weight:700;color:var(--primary)}
.trace-board{flex:1;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);position:relative;min-height:0;overflow:hidden}
.trace-board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tools{display:flex;flex-direction:column;gap:.8em}
.btn{background:var(--card);border-radius:999px;box-shadow:var(--shadow);padding:.8em 1.2em;font-weight:700;display:flex;align-items:center;gap:.5em;justify-content:center}
.btn:active{transform:translateY(3px)}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 6px 0 #4E3290}
.btn.ok{background:var(--ok);color:#fff;box-shadow:0 6px 0 #1F7743}
.btn.danger{background:var(--bad);color:#fff;box-shadow:0 6px 0 #A63835}
.btn.small{padding:.45em .9em;font-size:.85em}
.hint{color:var(--muted);text-align:center;font-size:.95em}
.meter{height:.8em;background:var(--line);border-radius:999px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

/* Celebración */
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.celebrate span{position:absolute;font-size:2.5em;animation:fall 1.6s ease-in forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}
.bigcheck{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50}
.bigcheck div{font-size:10em;color:var(--ok);animation:pop 1.2s ease forwards}
@keyframes pop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.1);opacity:1}80%{opacity:1}100%{transform:scale(1);opacity:0}}

/* Modal y avisos */
.modal-bg{position:fixed;inset:0;background:rgba(43,35,64,.45);display:grid;place-items:center;z-index:60;padding:1em}
.modal{background:var(--card);border-radius:var(--radius);padding:1.5em;max-width:34em;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 .6em;font-size:1.4em}
.row{display:flex;gap:.8em;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end;margin-top:1em}
.toast{position:fixed;bottom:1.2em;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7em 1.3em;border-radius:999px;z-index:70;font-size:.95em}

/* Teclado PIN */
.pin-dots{display:flex;gap:.8em;justify-content:center;margin:1em 0}
.pin-dots span{width:1.2em;height:1.2em;border-radius:50%;border:3px solid var(--primary)}
.pin-dots span.on{background:var(--primary)}
.keypad{display:grid;grid-template-columns:repeat(3,4.5em);gap:.8em;justify-content:center}
.keypad button{height:4.5em;border-radius:50%;background:var(--soft);font-size:1.3em;font-weight:700}
.keypad button:active{background:var(--primary-2);color:#fff}

/* Panel docente */
.teacher{background:#F6F4FB}
.tabs{display:flex;gap:.5em;padding:0 1.2em;flex-wrap:wrap}
.tabs button{padding:.6em 1.1em;border-radius:999px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--primary);color:#fff}
.panel{background:var(--card);border-radius:16px;padding:1.2em;box-shadow:0 2px 10px rgba(43,35,64,.06);margin-bottom:1em}
.panel h3{margin:0 0 .8em;font-size:1.15em}
.form{display:grid;gap:.9em}
.form label{display:grid;gap:.3em;font-weight:700;font-size:.9em}
.form input[type=text],.form input[type=password],.form select,.form textarea{padding:.6em .8em;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:400}
.form textarea{min-height:8em}
.form .check{display:flex;align-items:center;gap:.6em;font-weight:400}
.form .check input{width:1.3em;height:1.3em}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(14em,1fr));gap:.9em}
fieldset{border:2px solid var(--line);border-radius:14px;padding:.8em 1em}
legend{font-weight:700;padding:0 .4em;color:var(--primary)}
table{border-collapse:collapse;width:100%;font-size:.9em}
th,td{padding:.55em .6em;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:.85em}
tr.click{cursor:pointer}
tr.click:hover td{background:#FAF8FF}
.chip{display:inline-block;padding:.15em .6em;border-radius:999px;background:var(--soft);color:var(--primary);font-size:.8em;font-weight:700;margin:.1em}
.list-item{display:flex;align-items:center;gap:.8em;padding:.6em 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.list-item .av{font-size:1.8em}
.list-item .grow{flex:1}
.swatch{width:1.8em;height:1.8em;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatch.on{border-color:var(--ink)}
.avpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6em,1fr));gap:.3em}
.avpick button{font-size:1.6em;border-radius:12px;padding:.1em;border:3px solid transparent}
.avpick button.on{border-color:var(--primary);background:var(--soft)}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.4em,1fr));gap:.3em}
.letters button{padding:.35em 0;border-radius:10px;background:#F1EEF7;font-weight:700;color:var(--muted)}
.letters button.on{background:var(--primary);color:#fff}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(3.2em,1fr));gap:.35em}
.heat div{border-radius:10px;padding:.3em;text-align:center;font-weight:700;font-size:.9em;line-height:1.2}
.heat div small{display:block;font-weight:400;font-size:.75em}
.legend{display:flex;gap:1em;font-size:.8em;color:var(--muted);margin:.5em 0;flex-wrap:wrap}
.legend i{display:inline-block;width:.9em;height:.9em;border-radius:3px;margin-right:.3em;vertical-align:-.1em}
.empty{color:var(--muted);text-align:center;padding:1.5em}
.muted{color:var(--muted)}

@media (max-width:820px){
  .trace-wrap{flex-direction:column}
  .trace-side{width:auto;flex-direction:row;flex-wrap:wrap}
  .trace-side .side-card{flex:1}
  .trace-side .tools{flex-direction:row;flex:1 1 100%}
  .trace-side .tools .btn{flex:1}
  .options{grid-template-columns:1fr 1fr 1fr;gap:.6em}
  .opt{font-size:2.2em;min-height:5em}
  .opt.emo{font-size:3.2em}
  .prompt .phrase{font-size:1.8em}
}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tw table{min-width:36em}
.settings-opt{display:flex;gap:.8em;align-items:flex-start;padding:.8em;border:2px solid var(--line);border-radius:14px;cursor:pointer;margin-bottom:.6em;font-weight:400}
.settings-opt input{width:1.3em;height:1.3em;margin-top:.15em;flex:none}
.settings-opt b{display:block}
.settings-opt.on{border-color:var(--primary);background:#FAF8FF}

/* Móvil en vertical */
@media (max-width:600px){
  body{font-size:calc(15px * var(--scale))}
  .top{padding:.5em .7em;min-height:3.4em;gap:.5em}
  .top h1{font-size:1.15em}
  .top .who{font-size:.95em}
  .iconbtn{width:2.6em;height:2.6em;font-size:1.05em}
  .main{padding:0 .7em .8em}
  .hero{margin:.3em 0 .8em} .hero h2{font-size:1.45em}
  .grid{grid-template-columns:repeat(2,1fr);gap:.7em}
  .tile{min-height:6.5em;padding:.8em .5em;border-radius:18px}
  .tile .big{font-size:2.4em}
  .group-tile{min-height:7em;font-size:1.1em}
  .menu{grid-template-columns:1fr 1fr;gap:.8em}
  .menu .tile{min-height:9em;font-size:1.3em}
  .abc{grid-template-columns:repeat(5,1fr);gap:.45em}
  .abc .tile{min-height:3.8em;padding:.2em;border-width:3px}
  .abc .tile .big{font-size:2em}
  .abc .star{font-size:.7em}
  .prompt{min-height:6.5em;padding:.8em;margin-bottom:.9em}
  .prompt .emoji{font-size:4em}
  .prompt .phrase{font-size:1.5em}
  .speak{width:3.4em;height:3.4em;font-size:1.2em}
  .options{gap:.5em}
  .opt{min-height:4.6em;font-size:2em;border-width:4px}
  .opt.emo{font-size:2.7em}
  .trace-wrap{flex-direction:column;gap:.6em}
  .trace-side{flex-direction:column;flex-wrap:nowrap;gap:.5em;width:auto}
  .trace-side .side-card{flex:none;display:flex;align-items:center;justify-content:center;gap:.6em;padding:.4em .8em}
  .trace-side .side-card .emoji{font-size:2.4em}
  .trace-side .side-card .word{font-size:1.4em}
  .trace-side .tools{flex-direction:row;flex-wrap:wrap;gap:.45em;flex:none}
  .trace-side .tools .btn{flex:1 1 28%;padding:.65em .3em;font-size:.9em;white-space:nowrap}
  .trace-side .tools .side-card{flex:1 1 100%;display:block;padding:.45em .7em}
  .trace-side > .side-card{flex:none}
  .tools .side-card .hint{margin-top:.25em !important;font-size:.85em}
  .trace-board{min-height:42vh}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding:0 .7em .2em;-webkit-overflow-scrolling:touch}
  .tabs button{white-space:nowrap;padding:.5em .9em}
  .panel{padding:.8em;border-radius:14px}
  .list-item{flex-wrap:wrap}
  .list-item .grow{min-width:60%}
  .modal{padding:1em}
  .keypad{grid-template-columns:repeat(3,4em)}
  .keypad button{height:4em}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ .celebrate{display:none} .opt.bad{animation:none} }
</style>
</head>

<script>
"use strict";
/* =========================================================

const LETTERS = "abcdefghijklmnñopqrstuvwxyz".split("");
const LETTER_NAMES = {a:"a",b:"be",c:"ce",d:"de",e:"e",f:"efe",g:"ge",h:"hache",i:"i",j:"jota",k:"ka",l:"ele",m:"eme",n:"ene","ñ":"eñe",o:"o",p:"pe",q:"cu",r:"erre",s:"ese",t:"te",u:"u",v:"uve",w:"uve doble",x:"equis",y:"i griega",z:"zeta"};
const VOWELS = ["a","e","i","o","u"];

// Palabras con dibujo (emoji) y sílabas
const WORDS = [
  {w:"avión",s:["a","vión"],e:"✈️"},{w:"bota",s:["bo","ta"],e:"👢"},{w:"casa",s:["ca","sa"],e:"🏠"},

  {w:"tomate",s:["to","ma","te"],e:"🍅"},{w:"pelota",s:["pe","lo","ta"],e:"⚽"},{w:"coche",s:["co","che"],e:"🚗"},
  {w:"llave",s:["lla","ve"],e:"🔑"},{w:"conejo",s:["co","ne","jo"],e:"🐰"},{w:"mariposa",s:["ma","ri","po","sa"],e:"🦋"},
  {w:"lobo",s:["lo","bo"],e:"🐺"},{w:"pez",s:["pez"],e:"🐟"},{w:"dedo",s:["de","do"],e:"☝️"},
  {w:"leche",s:["le","che"],e:"🥛"},{w:"fresa",s:["fre","sa"],e:"🍓"},{w:"globo",s:["glo","bo"],e:"🎈"},
  {w:"pie",s:["pie"],e:"🦶"},{w:"limón",s:["li","món"],e:"🍋"},{w:"seta",s:["se","ta"],e:"🍄"},
  {w:"loro",s:["lo","ro"],e:"🦜"},{w:"cama",s:["ca","ma"],e:"🛏️"},{w:"tijera",s:["ti","je","ra"],e:"✂️"},
  {w:"pala",s:["pa","la"],e:"🪣"},{w:"ratón",s:["ra","tón"],e:"🐭"},{w:"camión",s:["ca","mión"],e:"🚚"},
  {w:"melón",s:["me","lón"],e:"🍈"},{w:"vela",s:["ve","la"],e:"🕯️"},{w:"moto",s:["mo","to"],e:"🏍️"}
];
// Palabra de ejemplo para cada letra (tarjeta lateral y pista)
const LETTER_WORD = {a:"avión",b:"bota",c:"casa",d:"dado",e:"erizo",f:"foca",g:"gato",h:"helado",i:"isla",j:"jirafa",k:"koala",l:"luna",m:"mano",n:"nube","ñ":"piña",o:"oso",p:"pato",q:"queso",r:"rana",s:"sol",t:"taza",u:"uva",v:"vaca",w:"kiwi",x:"taxi",y:"yoyó",z:"zapato"};

// Sílabas directas
const SYLLABLES = (()=>{
  const out=[];
  const simple=["m","p","l","s","t","n","d","f","b","r","v","j","ñ","ll","ch","y"];
  simple.forEach(c=>VOWELS.forEach(v=>out.push(c+v)));
  ["ca","co","cu","que","qui","ga","go","gu","gue","gui","za","zo","zu","ce","ci","ge","gi","ha","he","hi","ho","hu","ka","ki","ko"].forEach(s=>out.push(s));
  return [...new Set(out)];
})();

// Frases cortas con dibujo
const PHRASES = [
  {t:"El pato nada.",e:"🦆"},{t:"La luna sale.",e:"🌙"},{t:"Mi gato duerme.",e:"🐱"},{t:"La vaca come.",e:"🐄"},
  {t:"Tomo una pera.",e:"🍐"},{t:"El coche corre.",e:"🚗"},{t:"La foca nada.",e:"🦭"},{t:"Mi casa es bonita.",e:"🏠"},
  {t:"El oso come miel.",e:"🐻"},{t:"Me gusta el helado.",e:"🍦"},{t:"Mamá me da una uva.",e:"🍇"},
  {t:"El sol brilla.",e:"☀️"},{t:"La rana salta.",e:"🐸"},{t:"El mono come.",e:"🐒"},{t:"Pepe tiene un globo.",e:"🎈"},
  {t:"La moto es roja.",e:"🏍️"},{t:"Lola toma leche.",e:"🥛"},{t:"El loro habla.",e:"🦜"},{t:"Mi pelota bota.",e:"⚽"},

let VOICE=null;
function pickVoice(){
  if(!("speechSynthesis" in window)) return;
  const vs=speechSynthesis.getVoices();
  VOICE = vs.find(v=>/^es[-_]ES/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(text){
  try{
    if(!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="es-ES"; if(VOICE) u.voice=VOICE;
    const st=S.studentId||S.demo ? student() : null;
    u.rate = st && st.helps && st.helps.lenta ? .65 : .9;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- LEER ---------- */
function readingPool(st){
  const en=new Set(enabledLetters(st));
  const okWord = w=>[...stripAcc(w)].filter(c=>/[a-zñ]/.test(c)).every(c=>en.has(c));
  const lvl=st.cfg.lectura;
  if(lvl===1){ return enabledLetters(st).map(l=>({key:l,say:`¿Dónde está la ${LETTER_NAMES[l]}?`,repeat:LETTER_NAMES[l],label:l,hint:LETTER_WORD[l]})); }
  if(lvl===2){ let s=SYLLABLES.filter(okWord); if(s.length<4) s=SYLLABLES; return s.map(x=>({key:x,say:x,repeat:x,label:x})); }
  if(lvl===3){ let w=WORDS.filter(x=>okWord(x.w)); if(w.length<4) w=WORDS; return w.map(x=>({key:x.w,say:x.w,repeat:x.w,label:x.w,emoji:x.e})); }
  let p=PHRASES.filter(x=>okWord(x.t.replace(/[.,]/g,""))); if(p.length<4) p=PHRASES;
  return p.map(x=>({key:x.t,say:x.t,repeat:x.t,label:x.e,phrase:x.t}));
}
function startReading(){
  const st=student(); const pool=readingPool(st);
  const items=shuffle(pool).slice(0,Math.min(ROUND,pool.length));
  let idx=0, firstTry=0;
  const lvl=st.cfg.lectura;
  const next=()=>{
    if(idx>=items.length) return roundEnd("lectura",firstTry,items.length,startReading);
    const it=items[idx];
    const distract=shuffle(pool.filter(p=>p.label!==it.label && p.key!==it.key)).slice(0,2);
    const opts=shuffle([it,...distract]);
    let tries=0; const t0=performance.now();
    const fontCss=fontOf(st).css;
    let promptHTML="";
    if(lvl===1) promptHTML=`<button class="speak" data-say>🔊</button><span class="ask">Escucha y toca la letra</span>${st.helps.picto?`<span class="emoji" title="${esc(it.hint)}">${(WORDS.find(w=>w.w===it.hint)||{}).e||""}</span>`:""}`;
    if(lvl===2) promptHTML=`<button class="speak" data-say>🔊</button><span class="ask">Escucha y toca la sílaba</span>`;
    if(lvl===3) promptHTML=`<span class="emoji">${it.emoji}</span><button class="speak" data-say>🔊</button>`;
    if(lvl===4) promptHTML=`<span class="phrase" style="font-family:${fontCss}">${esc(show(st,it.phrase))}</span><button class="speak" data-say>🔊</button>`;
    h(`${topBar("👀 Leer · "+LEVELS.lectura[lvl], true)}
    <div class="main">
      <div class="progress-dots">${items.map((_,i)=>`<span class="${i<idx?"on":""}"></span>`).join("")}</div>
      <div class="prompt">${promptHTML}</div>
      <div class="options">${opts.map((o,i)=>`<button class="opt ${lvl===4?"emo":""}" data-i="${i}" style="${lvl===4?"":`font-family:${fontCss}`}">${esc(lvl===4?o.label:show(st,o.label))}</button>`).join("")}</div>
    </div>`);
    bindBack(screenStudentHome);
    const sayIt=()=>say(it.say);
    app.querySelector("[data-say]").onclick=()=>say(lvl===1&&tries>0?it.repeat:it.say);
    if(lvl!==4) setTimeout(sayIt,350);
    let locked=false;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(locked) return;
      const o=opts[+b.dataset.i]; tries++;
      if(o===it){
        locked=true; b.classList.add("ok"); if(tries===1) firstTry++;
        record("lectura",lvl,it.key,tries,tries===1?100:Math.max(0,100-50*(tries-1)),performance.now()-t0);
        celebrate(); praise(["¡Muy bien!","¡Genial!","¡Eso es!","¡Fenomenal!"]);
        setTimeout(()=>{idx++;next();},1500);
      }else{
        b.classList.remove("bad"); void b.offsetWidth; b.classList.add("bad");
        say("Prueba otra vez");
        setTimeout(()=>sayIt(),1100);
      }
    });
  };
  next();
}

/* ---------- ESCRIBIR ---------- */
function startWriting(){
  const st=student();
  if(st.cfg.escritura===1) return screenAlphabet();
  const en=new Set(enabledLetters(st));
  const okWord = w=>[...stripAcc(w)].every(c=>en.has(c));
  let pool = st.cfg.escritura===2 ? SYLLABLES.filter(okWord) : WORDS.filter(x=>okWord(x.w)&&x.w.length<=7).map(x=>x.w);
  if(pool.length<3) pool = st.cfg.escritura===2 ? SYLLABLES : WORDS.filter(x=>x.w.length<=7).map(x=>x.w);
  const items=shuffle(pool).slice(0,ROUND);
  let idx=0, good=0;
  const next=()=>{
    if(idx>=items.length) return roundEnd("escritura",good,items.length,startWriting);
    const txt=items[idx]; const w=WORDS.find(x=>x.w===txt);
    traceScreen({text:txt, title:"✏️ Escribir · "+LEVELS.escritura[st.cfg.escritura], emoji:w?w.e:null, word:txt,
      speak:txt, progress:[idx,items.length],
      onBack:screenStudentHome,
      onDone:(firstTry)=>{ if(firstTry) good++; idx++; next(); }});
  };
  next();
}

}

/* ---------- MOTOR DE TRAZADO ----------
   El texto se dibuja con la fuente elegida. Se comprueba:
   - cobertura: qué parte de la letra ha recorrido el dedo
   - salidas: qué parte del trazo del niño cae fuera de la guía
   Funciona igual para cualquier fuente, letra, sílaba o palabra. */
function traceScreen(o){
  const st=student(); const tol=TOLERANCE[st.helps.tol]||TOLERANCE.media;
  const font=fontOf(st); const text=font.transform(o.text);
  h(`${topBar(esc(o.title), true)}
  <div class="main" style="display:flex;flex-direction:column">
    ${o.progress?`<div class="progress-dots">${Array.from({length:o.progress[1]},(_,i)=>`<span class="${i<o.progress[0]?"on":""}"></span>`).join("")}</div>`:""}
    <div class="trace-wrap" style="flex:1">
      <div class="trace-side">
        ${o.emoji&&(st.helps.picto||st.cfg.escritura>1)?`<div class="side-card"><div class="emoji">${o.emoji}</div><div class="word" style="font-family:${font.css}">${esc(font.transform(o.word))}</div></div>`:""}
        <div class="tools">
          <button class="btn primary" data-say>🔊 Escuchar</button>
          <button class="btn" data-clear>🧽 Borrar</button>
          <button class="btn ok" data-check>✓ He terminado</button>
          <div class="side-card" style="padding:.7em"><div class="meter"><i data-meter></i></div><div class="hint" data-msg style="margin-top:.4em">Repasa la letra con el dedo</div></div>
        </div>
      </div>
      <div class="trace-board"><canvas data-guide></canvas><canvas data-ink></canvas></div>
    </div>
  </div>`);
  bindBack(()=>{ cleanup(); o.onBack(); });
  const board=app.querySelector(".trace-board");
  const gC=app.querySelector("[data-guide]"), iC=app.querySelector("[data-ink]");
  const meter=app.querySelector("[data-meter]"), msg=app.querySelector("[data-msg]");
  let strokes=[], cur=null, W=0,H=0, geo=null, tries=0, finished=false, activePointer=null;
  const t0=performance.now();
  const SC=.25; // escala de las máscaras de comprobación
  let glyphMask=null, corridorMask=null, glyphCount=0;

  function computeGeo(ctx){
    ctx.font=`100px ${font.css}`;
    const ref=ctx.measureText("lhkbdHÁ"), refD=ctx.measureText("gjpqyñ"), m=ctx.measureText(text);
    const asc=ref.actualBoundingBoxAscent, desc=refD.actualBoundingBoxDescent;
    const width=m.actualBoundingBoxLeft+m.actualBoundingBoxRight;
    const fs=Math.min(H*.80/((asc+desc)/100), W*.84/(width/100), H*1.2);
    const k=fs/100;
    const xh=ctx.measureText("x").actualBoundingBoxAscent*k, cap=ctx.measureText("H").actualBoundingBoxAscent*k;
    const base=(H-(asc+desc)*k)/2+asc*k;
    const x=(W-width*k)/2+m.actualBoundingBoxLeft*k;
    return {fs,base,x,xh,cap,asc:asc*k,desc:desc*k};
  }
  function drawText(ctx,mode){
    ctx.font=`${geo.fs}px ${font.css}`; ctx.textBaseline="alphabetic"; ctx.textAlign="left";
    ctx.lineJoin="round"; ctx.lineCap="round";
    if(mode==="corridor"){ ctx.fillStyle="#000"; ctx.strokeStyle="#000"; ctx.lineWidth=geo.fs*.13*tol.k; ctx.strokeText(text,geo.x,geo.base); ctx.fillText(text,geo.x,geo.base); }
    else if(mode==="glyph"){ ctx.fillStyle="#000"; ctx.fillText(text,geo.x,geo.base); }
  }
  function drawGuide(){
    const dpr=window.devicePixelRatio||1;
    [gC,iC].forEach(c=>{c.width=W*dpr;c.height=H*dpr;c.getContext("2d").setTransform(dpr,0,0,dpr,0,0);});
    const g=gC.getContext("2d");
    geo=computeGeo(g);
    // pauta escolar
    const lines=[[geo.base-geo.asc,"#D9D2E6",[10,10]],[geo.base-geo.xh,"#8FB7F0",[14,10]],[geo.base,"#4E8FE8",[]],[geo.base+geo.desc,"#D9D2E6",[10,10]]];
    lines.forEach(([y,c,d])=>{g.beginPath();g.setLineDash(d);g.strokeStyle=c;g.lineWidth=3;g.moveTo(W*.03,y);g.lineTo(W*.97,y);g.stroke();});
    g.setLineDash([]);
    // camino permitido (muy suave) + letra modelo
    g.save(); g.globalAlpha=.55; g.fillStyle="#F1ECFB"; g.strokeStyle="#F1ECFB"; g.font=`${geo.fs}px ${font.css}`;
    g.lineJoin="round"; g.lineWidth=geo.fs*.13*tol.k; g.strokeText(text,geo.x,geo.base); g.restore();
    g.font=`${geo.fs}px ${font.css}`; g.fillStyle="#D8D2E3"; g.fillText(text,geo.x,geo.base);
    g.setLineDash([2,Math.max(6,geo.fs*.035)]); g.lineCap="round"; g.strokeStyle="#7D7394"; g.lineWidth=Math.max(3,geo.fs*.018);
    g.strokeText(text,geo.x,geo.base); g.setLineDash([]);
    // máscaras de comprobación
    const sw=Math.max(1,Math.ceil(W*SC)), sh=Math.max(1,Math.ceil(H*SC));
    const mk=mode=>{const c=document.createElement("canvas");c.width=sw;c.height=sh;const x=c.getContext("2d");x.scale(SC,SC);drawText(x,mode);return x.getImageData(0,0,sw,sh).data;};
    glyphMask=mk("glyph"); corridorMask=mk("corridor");
    glyphCount=0; for(let i=3;i<glyphMask.length;i+=4) if(glyphMask[i]>100) glyphCount++;
    window.__trace={geo,text,font:font.css,W,H};
    redrawInk();
  }
  const brush=()=>Math.max(10,geo.fs*.07);
  function strokePath(ctx,s){
    if(!s.length) return;
    ctx.beginPath(); ctx.moveTo(s[0][0],s[0][1]);
    if(s.length===1){ ctx.lineTo(s[0][0]+.1,s[0][1]); }
    for(let i=1;i<s.length-1;i++){ const mx=(s[i][0]+s[i+1][0])/2, my=(s[i][1]+s[i+1][1])/2; ctx.quadraticCurveTo(s[i][0],s[i][1],mx,my); }
    if(s.length>1) ctx.lineTo(s[s.length-1][0],s[s.length-1][1]);
    ctx.stroke();
  }
  function redrawInk(){
    const c=iC.getContext("2d"); c.clearRect(0,0,W,H);
    c.lineCap="round"; c.lineJoin="round"; c.strokeStyle=finished?"#2E9E5B":"#3C7DD9"; c.lineWidth=brush();
    strokes.forEach(s=>strokePath(c,s));
  }
  function evaluate(){
    const sw=Math.ceil(W*SC), sh=Math.ceil(H*SC);
    const mk=lw=>{const c=document.createElement("canvas");c.width=sw;c.height=sh;const x=c.getContext("2d");x.scale(SC,SC);x.lineCap="round";x.lineJoin="round";x.strokeStyle="#000";x.lineWidth=lw;strokes.forEach(s=>strokePath(x,s));return x.getImageData(0,0,sw,sh).data;};
    const wide=mk(geo.fs*.12*tol.k), ink=mk(brush());
    // Además del total, se divide la letra en cuadritos: cada zona debe estar repasada
    const cs=Math.max(2,Math.round(geo.fs*SC*.12)), cw=Math.ceil(sw/cs);
    const cg={}, cc={};
    let cov=0, inkN=0, out=0;
    for(let i=3;i<wide.length;i+=4){
      const p=(i-3)/4;
      if(glyphMask[i]>100){ const k=Math.floor((p%sw)/cs)+cw*Math.floor(Math.floor(p/sw)/cs); cg[k]=(cg[k]||0)+1; if(wide[i]>60){cov++; cc[k]=(cc[k]||0)+1;} }
      if(ink[i]>100){ inkN++; if(corridorMask[i]<60) out++; }
    }
    let cells=0, cellsOk=0; const minPx=cs*cs*.15;
    for(const k in cg){ if(cg[k]<minPx) continue; cells++; if((cc[k]||0)/cg[k]>=.5) cellsOk++; }
    const coverage=glyphCount?cov/glyphCount:0, outside=inkN?out/inkN:0, zones=cells?cellsOk/cells:0;
    window.__last={coverage,outside,zones};
    return {coverage,outside,zones,acc:Math.max(0,Math.min(100,(coverage+zones)*50-outside*60))};
  }
  function updateMeter(){
    if(!strokes.length){ meter.style.width="0"; return null; }
    const r=evaluate(); meter.style.width=Math.min(100,Math.min(r.coverage/tol.cover,r.zones/tol.cell)*100)+"%";
    meter.style.background = r.outside>tol.out ? "var(--warn)" : "var(--ok)";
    return r;
  }
  function success(r){
    finished=true; redrawInk();
    record("escritura",st.cfg.escritura,o.text,tries+1,r.acc,performance.now()-t0);
    celebrate(); praise(["¡Muy bien!","¡Qué bonita te ha quedado!","¡Genial!","¡Perfecto!"]);
    msg.innerHTML="¡Conseguido! 🎉";
    const tools=app.querySelector(".tools");
    const nb=document.createElement("button"); nb.className="btn primary"; nb.style.fontSize="1.15em";
    nb.textContent=o.nextLabel||"Siguiente ➡️";
    nb.onclick=()=>{cleanup(); o.onDone(tries===0);};
    tools.prepend(nb);
    if(!o.nextLabel) setTimeout(()=>{ if(document.body.contains(nb)) nb.click(); },1800);
  }
  function check(manual){
    if(finished) return;
    const r=updateMeter(); if(!r) { if(manual){msg.textContent="Primero repasa la letra con el dedo ☝️"; say("Repasa la letra con el dedo");} return; }
    if(r.coverage>=tol.cover && r.zones>=tol.cell && r.outside<=tol.out) return success(r);
    if(manual){
      tries++;
      if(r.outside>tol.out){ msg.textContent="Te has salido un poco. ¡Borra y prueba otra vez!"; say("Te has salido un poco. Prueba otra vez"); }
      else { msg.textContent="¡Casi! Te falta un trocito."; say("Casi. Te falta un trocito"); }
    }
  }
  // Dedo / ratón / lápiz (un solo punto de contacto)
  const pos=e=>{const r=iC.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
  iC.addEventListener("pointerdown",e=>{
    if(finished||activePointer!==null) return;
    activePointer=e.pointerId; try{iC.setPointerCapture(e.pointerId);}catch(_){}
    cur=[pos(e)]; strokes.push(cur); redrawInk();
  });
  iC.addEventListener("pointermove",e=>{
    if(e.pointerId!==activePointer||!cur) return;
    const p=pos(e), l=cur[cur.length-1]; if(Math.hypot(p[0]-l[0],p[1]-l[1])<2) return;
    cur.push(p);
    const c=iC.getContext("2d"); c.lineCap="round";c.lineJoin="round";c.strokeStyle="#3C7DD9";c.lineWidth=brush();
    c.beginPath(); c.moveTo(l[0],l[1]); c.lineTo(p[0],p[1]); c.stroke();
  });
  const end=e=>{ if(e.pointerId!==activePointer) return; activePointer=null; cur=null; redrawInk(); check(false); };
  iC.addEventListener("pointerup",end); iC.addEventListener("pointercancel",end);

  app.querySelector("[data-say]").onclick=()=>say(o.speak);
  app.querySelector("[data-clear]").onclick=()=>{ if(finished) return; if(strokes.length) tries++; strokes=[]; redrawInk(); updateMeter(); msg.textContent="Repasa la letra con el dedo"; };
  app.querySelector("[data-check]").onclick=()=>check(true);

  const ro=new ResizeObserver(()=>{ const r=board.getBoundingClientRect(); if(r.width<10||r.height<10) return;
    const scaleX=W?r.width/W:1, scaleY=H?r.height/H:1;
    strokes=strokes.map(s=>s.map(([x,y])=>[x*scaleX,y*scaleY]));
    W=r.width; H=r.height; drawGuide(); });
  function cleanup(){ ro.disconnect(); }
  document.fonts.load(`100px ${font.css}`).then(()=>{ ro.observe(board); setTimeout(()=>say(o.speak),300); });
}

function teacherLogin(){
  if(!DB.teachers.length) return teacherSetup();
  modal(`<h3>Entrar como docente</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(9em,1fr))">
    ${DB.teachers.map(t=>`<button class="tile" data-t="${t.id}" style="min-height:5em"><span style="font-size:2em">👩‍🏫</span>${esc(t.name)}</button>`).join("")}
  </div><div class="row end"><button class="btn" data-x>Cancelar</button></div>`,(m,close)=>{
    m.querySelector("[data-x]").onclick=close;
    m.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{close(); pinPad(byId(DB.teachers,b.dataset.t));});
  });
}
function pinPad(t){
  let pin="";
  modal(`<h3 style="text-align:center">${esc(t.name)}: escribe tu PIN</h3><div class="pin-dots">${"<span></span>".repeat(4)}</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9,"⌫",0,"✕"].map(k=>`<button data-k="${k}">${k}</button>`).join("")}</div>`,(m,close)=>{
    const dots=m.querySelectorAll(".pin-dots span");
    const paint=()=>dots.forEach((d,i)=>d.classList.toggle("on",i<pin.length));
    m.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;
      if(k==="✕") return close();
      if(k==="⌫"){pin=pin.slice(0,-1);paint();return;}
      pin+=k; paint();
      if(pin.length===4){
        if(pin===t.pin){ close(); S.teacherId=t.id; S.tTab="grupos"; teacherPanel(); }
        else { toast("PIN incorrecto"); pin=""; setTimeout(paint,200); }
      }
    });
  });
}
function teacherSetup(){
  modal(`<h3>Bienvenida 👋</h3><p class="muted">Crea la primera cuenta docente. Será la de administración: podrá ver todas las clases y dar de alta a otros docentes.</p>
  <div class="form"><label>Nombre<input type="text" data-n placeholder="Ej.: Seño Marta"></label>
  <label>PIN de 4 cifras<input type="password" inputmode="numeric" maxlength="4" data-p></label></div>
  <div class="row end"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Crear</button></div>`,(m,close)=>{
    m.querySelector("[data-x]").onclick=close;
    m.querySelector("[data-ok]").onclick=()=>{
      const n=m.querySelector("[data-n]").value.trim(), p=m.querySelector("[data-p]").value.trim();
      if(!n||!/^\d{4}$/.test(p)) return toast("Escribe un nombre y un PIN de 4 cifras");
      const t={id:uid(),name:n,pin:p,admin:true}; DB.teachers.push(t); save(); close();

function me(){ return byId(DB.teachers,S.teacherId); }

function teacherPanel(){

}

  return `<div class="two">

  </div>`;
}
const readCfg=m=>({lectura:+m.querySelector("[data-cl]").value,escritura:+m.querySelector("[data-ce]").value,font:m.querySelector("[data-cf]").value});

function tabGroups(body){
  const gs=myGroups();

  ${gs.length?gs.map(g=>{const n=DB.students.filter(s=>s.group===g.id).length;
    const tn=(g.teachers||[]).map(id=>byId(DB.teachers,id)).filter(Boolean).map(x=>`<span class="chip">${esc(x.name)}</span>`).join("");
    return `<div class="panel"><div class="list-item"><span class="av" style="background:${g.color};border-radius:12px;padding:.1em .25em">${g.icon||"🏫"}</span>
    <div class="grow"><b>${esc(g.name)}</b><div class="muted" style="font-size:.85em">${n} alumnos · Por defecto: ${LEVELS.lectura[g.defaults.lectura]} / ${LEVELS.escritura[g.defaults.escritura]} / ${FONTS[g.defaults.font].label}</div><div>${tn}</div></div>
    <button class="btn small" data-edit="${g.id}">Editar</button><button class="btn small" data-st="${g.id}">Alumnado</button></div></div>`;}).join("")

function groupForm(g){
  const isNew=!g; const t=me();
  g = g || {id:uid(),name:"",color:GROUP_COLORS[DB.groups.length%GROUP_COLORS.length],icon:"🏫",defaults:defaultCfg(),teachers:[t.id]};
  let color=g.color, icon=g.icon;
  const icons=["🏫","🌈","🐞","🦋","🌻","🚀","🐠","🦁","🍎","⭐","🌳","🎨"];
  modal(`<h3>${isNew?"Nueva clase":"Editar clase"}</h3><div class="form">
    <label>Nombre<input type="text" data-n value="${esc(g.name)}" placeholder="Ej.: Infantil 5 años A, Aula PT…"></label>

    <div><b style="font-size:.9em">Dibujo</b><div class="avpick" style="margin-top:.3em">${icons.map(i=>`<button data-i="${i}" class="${i===icon?"on":""}">${i}</button>`).join("")}</div></div>
    <fieldset><legend>Valores por defecto para alumnos nuevos</legend>${cfgFields(g.defaults)}
      ${isNew?"":`<button class="btn small" data-apply style="margin-top:.8em">Aplicar a todo el alumnado de la clase</button>`}</fieldset>
    <fieldset><legend>Docentes que comparten esta clase</legend>${DB.teachers.map(x=>`<label class="check"><input type="checkbox" data-tt="${x.id}" ${(g.teachers||[]).includes(x.id)?"checked":""}> ${esc(x.name)}</label>`).join("")}</fieldset>
  </div><div class="row end">${isNew?"":`<button class="btn danger" data-del>Eliminar</button>`}<span style="flex:1"></span><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Guardar</button></div>`,(m,close)=>{
    m.querySelectorAll("[data-c]").forEach(s=>s.onclick=()=>{color=s.dataset.c;m.querySelectorAll("[data-c]").forEach(x=>x.classList.toggle("on",x===s));});
    m.querySelectorAll("[data-i]").forEach(s=>s.onclick=()=>{icon=s.dataset.i;m.querySelectorAll("[data-i]").forEach(x=>x.classList.toggle("on",x===s));});
    m.querySelector("[data-x]").onclick=close;
    const collect=()=>{
      const n=m.querySelector("[data-n]").value.trim(); if(!n){toast("Pon un nombre a la clase");return false;}
      g.name=n; g.color=color; g.icon=icon; g.defaults=readCfg(m);
      g.teachers=[...m.querySelectorAll("[data-tt]")].filter(x=>x.checked).map(x=>x.dataset.tt);
      if(!g.teachers.includes(t.id)&&!t.admin) g.teachers.push(t.id);
      return true;
    };
    m.querySelector("[data-ok]").onclick=()=>{ if(!collect())return; if(isNew)DB.groups.push(g); save(); close(); teacherPanel(); };
    const ap=m.querySelector("[data-apply]"); if(ap) ap.onclick=()=>{ if(!collect())return;
      confirmBox("¿Aplicar estos niveles y tipo de letra a todo el alumnado de la clase?","Aplicar",()=>{
        DB.students.filter(s=>s.group===g.id).forEach(s=>s.cfg=Object.assign({},g.defaults)); save(); close(); toast("Aplicado"); teacherPanel(); }); };
    const del=m.querySelector("[data-del]"); if(del) del.onclick=()=>confirmBox(`¿Eliminar la clase «${g.name}» con todo su alumnado y progreso?`,"Eliminar",()=>{

      DB.records=DB.records.filter(r=>!ids.has(r.st)); DB.students=DB.students.filter(s=>s.group!==g.id);
      DB.groups=DB.groups.filter(x=>x.id!==g.id); save(); close(); teacherPanel(); });
  });
}

function bindGroupSelect(body){ const s=body.querySelector("[data-gsel]"); if(s) s.onchange=()=>{S.tGroup=s.value;S.tStudent=null;teacherPanel();}; }

function tabStudents(body){
  body.innerHTML=groupSelect(`<span style="flex:1"></span><button class="btn primary" data-add>➕ Añadir alumnado</button>`);
  bindGroupSelect(body); if(!myGroups().length) return;
  const g=byId(DB.groups,S.tGroup);
  const sts=DB.students.filter(s=>s.group===g.id).sort((a,b)=>a.name.localeCompare(b.name,"es"));
  body.insertAdjacentHTML("beforeend",`<div class="panel">${sts.length?`<div class="tw"><table><thead><tr><th></th><th>Nombre</th><th>Lectura</th><th>Escritura</th><th>Letra</th><th>Ayudas</th><th>Letras</th></tr></thead><tbody>
    ${sts.map(s=>`<tr class="click" data-s="${s.id}"><td style="font-size:1.6em">${s.avatar}</td><td><b>${esc(s.name)}</b></td>
    <td>${LEVELS.lectura[s.cfg.lectura]}</td><td>${LEVELS.escritura[s.cfg.escritura]}</td><td>${FONTS[s.cfg.font].label}</td>
    <td>${helpChips(s.helps)}</td><td>${s.letters&&s.letters.length<27?`<span class="chip">${s.letters.length} de 27</span>`:"Todas"}</td></tr>`).join("")}

function helpChips(hp){
  const c=[]; if(hp.grande)c.push("Botones grandes"); if(hp.tol!=="media")c.push("Trazo: "+TOLERANCE[hp.tol].label);
  if(hp.lenta)c.push("Voz lenta"); if(hp.calma)c.push("Modo tranquilo"); if(!hp.picto)c.push("Sin dibujos");
  return c.length?c.map(x=>`<span class="chip">${x}</span>`).join(""):`<span class="muted">—</span>`;

function bulkAdd(g){
  modal(`<h3>Añadir alumnado a «${esc(g.name)}»</h3><div class="form">
    <label>Escribe o pega los nombres, uno por línea<textarea data-names placeholder="Lucía&#10;Mateo&#10;Aitana"></textarea></label>
    <p class="muted" style="margin:0">Se crearán con los valores por defecto de la clase (${LEVELS.lectura[g.defaults.lectura]} / ${LEVELS.escritura[g.defaults.escritura]} / ${FONTS[g.defaults.font].label}) y un animal distinto para cada uno. Después puedes ajustar a cada alumno por separado.</p>
  </div><div class="row end"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Añadir</button></div>`,(m,close)=>{
    m.querySelector("[data-x]").onclick=close;
    m.querySelector("[data-ok]").onclick=()=>{
      const names=m.querySelector("[data-names]").value.split(/\n|,/).map(s=>s.trim()).filter(Boolean);
      if(!names.length) return toast("Escribe al menos un nombre");
      const used=new Set(DB.students.filter(s=>s.group===g.id).map(s=>s.avatar));
      const free=shuffle(AVATARS.filter(a=>!used.has(a)));
      names.forEach((n,i)=>DB.students.push({id:uid(),group:g.id,name:n,avatar:free[i]||pick(AVATARS),cfg:Object.assign({},g.defaults),helps:defaultHelps(),letters:null}));
      save(); close(); toast(`${names.length} alumno(s) añadido(s)`); teacherPanel();
    };
  });
}
function studentForm(s){
  let av=s.avatar; let letters=new Set(s.letters&&s.letters.length?s.letters:LETTERS);
  const hp=Object.assign(defaultHelps(),s.helps);
  modal(`<h3>${s.avatar} ${esc(s.name)}</h3><div class="form">
    <label>Nombre<input type="text" data-n value="${esc(s.name)}"></label>
    <div><b style="font-size:.9em">Animal</b><div class="avpick" style="margin-top:.3em">${AVATARS.map(a=>`<button data-a="${a}" class="${a===av?"on":""}">${a}</button>`).join("")}</div></div>
    <fieldset><legend>Nivel por áreas y tipo de letra</legend>${cfgFields(s.cfg)}</fieldset>
    <fieldset><legend>Ayudas</legend>
      <label class="check"><input type="checkbox" data-hg ${hp.grande?"checked":""}> Botones y textos más grandes</label>
      <label class="check"><input type="checkbox" data-hl ${hp.lenta?"checked":""}> Voz más lenta</label>
      <label class="check"><input type="checkbox" data-hc ${hp.calma?"checked":""}> Modo tranquilo (sin confeti, refuerzo suave)</label>
      <label class="check"><input type="checkbox" data-hp ${hp.picto?"checked":""}> Apoyo con dibujos</label>
      <label>Exigencia del trazado<select data-ht>${Object.entries(TOLERANCE).map(([k,v])=>`<option value="${k}" ${hp.tol===k?"selected":""}>${v.label}</option>`).join("")}</select></label>
    </fieldset>
    <fieldset><legend>Letras trabajadas</legend>
      <div class="row" style="margin-bottom:.5em"><button class="btn small" data-all>Todas</button><button class="btn small" data-vow>Solo vocales</button><button class="btn small" data-none>Ninguna</button></div>
      <div class="letters">${LETTERS.map(l=>`<button data-l="${l}" class="${letters.has(l)?"on":""}">${l}</button>`).join("")}</div>
      <p class="muted" style="font-size:.8em;margin:.5em 0 0">Las sílabas, palabras y frases solo usarán estas letras (si hay suficientes).</p>
    </fieldset>
  </div><div class="row end"><button class="btn danger" data-del>Eliminar</button><span style="flex:1"></span><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Guardar</button></div>`,(m,close)=>{
    m.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{av=b.dataset.a;m.querySelectorAll("[data-a]").forEach(x=>x.classList.toggle("on",x===b));});
    const paintL=()=>m.querySelectorAll("[data-l]").forEach(b=>b.classList.toggle("on",letters.has(b.dataset.l)));
    m.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const l=b.dataset.l; letters.has(l)?letters.delete(l):letters.add(l); paintL();});
    m.querySelector("[data-all]").onclick=()=>{letters=new Set(LETTERS);paintL();};
    m.querySelector("[data-vow]").onclick=()=>{letters=new Set(VOWELS);paintL();};
    m.querySelector("[data-none]").onclick=()=>{letters=new Set();paintL();};
    m.querySelector("[data-x]").onclick=close;
    m.querySelector("[data-ok]").onclick=()=>{
      const n=m.querySelector("[data-n]").value.trim(); if(!n) return toast("Escribe el nombre");
      if(!letters.size) return toast("Elige al menos una letra");
      s.name=n; s.avatar=av; s.cfg=readCfg(m);
      s.helps={grande:m.querySelector("[data-hg]").checked,lenta:m.querySelector("[data-hl]").checked,calma:m.querySelector("[data-hc]").checked,picto:m.querySelector("[data-hp]").checked,tol:m.querySelector("[data-ht]").value};
      s.letters = letters.size===27?null:LETTERS.filter(l=>letters.has(l));
      save(); close(); teacherPanel();
    };
    m.querySelector("[data-del]").onclick=()=>confirmBox(`¿Eliminar a ${s.name} y todo su progreso?`,"Eliminar",()=>{
      DB.students=DB.students.filter(x=>x.id!==s.id); DB.records=DB.records.filter(r=>r.st!==s.id); save(); close(); teacherPanel(); });
  });
}

/* ---- Progreso ---- */
const DAY=864e5;
function weekStart(t){ const d=new Date(t); d.setHours(0,0,0,0); const wd=(d.getDay()+6)%7; return d.getTime()-wd*DAY; }
function summarize(recs){
  const L=recs.filter(r=>r.area==="lectura"), E=recs.filter(r=>r.area==="escritura");
  return {
    days:new Set(recs.map(r=>new Date(r.t).toDateString())).size,
    lect:L.length?Math.round(L.filter(r=>r.tries===1).length/L.length*100):null, nL:L.length,
    escr:E.length?Math.round(E.reduce((a,r)=>a+r.acc,0)/E.length):null, nE:E.length,
    last:recs.length?Math.max(...recs.map(r=>r.t)):null
  };
}
const pctColor=v=>v==null?"#EEEAF4":v>=80?"#CDEFD9":v>=50?"#FBE7C2":"#F8D3D1";
const fmtDate=t=>t?new Date(t).toLocaleDateString("es-ES",{day:"numeric",month:"short"}):"—";

function tabProgress(body){
  body.innerHTML=groupSelect(); bindGroupSelect(body); if(!myGroups().length) return;
  if(S.tStudent) return studentProgress(body, byId(DB.students,S.tStudent));
  const g=byId(DB.groups,S.tGroup);
  const sts=DB.students.filter(s=>s.group===g.id).sort((a,b)=>a.name.localeCompare(b.name,"es"));
  body.insertAdjacentHTML("beforeend",`<div class="panel"><h3>Resumen de la clase</h3>
  ${sts.length?`<div class="tw"><table><thead><tr><th></th><th>Nombre</th><th>Días de uso</th><th>Lectura<br><small>aciertos a la primera</small></th><th>Escritura<br><small>precisión del trazo</small></th><th>Últimas 4 semanas</th><th>Último uso</th></tr></thead><tbody>
  ${sts.map(s=>{const recs=DB.records.filter(r=>r.st===s.id); const sm=summarize(recs);
    return `<tr class="click" data-s="${s.id}"><td style="font-size:1.6em">${s.avatar}</td><td><b>${esc(s.name)}</b></td><td>${sm.days}</td>
    <td><span class="chip" style="background:${pctColor(sm.lect)};color:var(--ink)">${sm.lect==null?"—":sm.lect+" %"}</span> <small class="muted">${sm.nL} ej.</small></td>
    <td><span class="chip" style="background:${pctColor(sm.escr)};color:var(--ink)">${sm.escr==null?"—":sm.escr+" %"}</span> <small class="muted">${sm.nE} ej.</small></td>
    <td>${spark(recs)}</td><td>${fmtDate(sm.last)}</td></tr>`;}).join("")}
  </tbody></table></div><p class="muted" style="font-size:.85em">Toca un alumno para ver su evolución y el detalle por letras.</p>`:`<div class="empty">No hay alumnado en esta clase.</div>`}</div>`);
  body.querySelectorAll("[data-s]").forEach(r=>r.onclick=()=>{S.tStudent=r.dataset.s;teacherPanel();});
}
function weekly(recs,n){
  const now=weekStart(Date.now()); const out=[];
  for(let i=n-1;i>=0;i--){ const ws=now-i*7*DAY; const rs=recs.filter(r=>r.t>=ws&&r.t<ws+7*DAY); const sm=summarize(rs); out.push({ws,lect:sm.lect,escr:sm.escr,n:rs.length}); }
  return out;
}
function spark(recs){
  const w=weekly(recs,4); const mx=Math.max(1,...w.map(x=>x.n));
  return `<svg width="84" height="26" viewBox="0 0 84 26" aria-label="Actividad semanal">${w.map((x,i)=>{const v=x.n?Math.max(3,x.n/mx*24):2;return `<rect x="${i*21+2}" y="${26-v}" width="16" height="${v}" rx="3" fill="${x.n?"#8E6DE0":"#E6DFF2"}"><title>${x.n} ejercicios</title></rect>`;}).join("")}</svg>`;
}
function studentProgress(body,s){
  const recs=DB.records.filter(r=>r.st===s.id); const sm=summarize(recs);
  const wk=weekly(recs,8);
  // Gráfica semanal: dos series, % (0-100)
  const Wd=640,Hd=220,pl=36,pb=28,bw=(Wd-pl-10)/8;
  const bars=wk.map((x,i)=>{
    const X=pl+i*bw; const y=v=>Hd-pb-(v/100)*(Hd-pb-12);
    let r="";
    if(x.lect!=null) r+=`<rect x="${X+bw*.14}" y="${y(x.lect)}" width="${bw*.34}" height="${Hd-pb-y(x.lect)}" rx="4" fill="#6C4AB6"><title>Lectura ${x.lect} %</title></rect>`;
    if(x.escr!=null) r+=`<rect x="${X+bw*.52}" y="${y(x.escr)}" width="${bw*.34}" height="${Hd-pb-y(x.escr)}" rx="4" fill="#2E9E8F"><title>Escritura ${x.escr} %</title></rect>`;
    r+=`<text x="${X+bw/2}" y="${Hd-8}" text-anchor="middle" font-size="12" fill="#6B6380">${new Date(x.ws).toLocaleDateString("es-ES",{day:"numeric",month:"numeric"})}</text>`;
    return r;}).join("");
  const grid=[0,50,100].map(v=>{const y=Hd-pb-(v/100)*(Hd-pb-12);return `<line x1="${pl}" x2="${Wd-6}" y1="${y}" y2="${y}" stroke="#ECE7F4"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#6B6380">${v}%</text>`;}).join("");
  // Por letras
  const per=(area)=>{const m={}; recs.filter(r=>r.area===area&&r.lvl===1).forEach(r=>{(m[r.item]=m[r.item]||[]).push(r)}); return m;};
  const pl1=per("lectura"), pe1=per("escritura");
  const cellL=l=>{const a=pl1[l]; if(!a) return null; return Math.round(a.filter(r=>r.tries===1).length/a.length*100);};
  const cellE=l=>{const a=pe1[l]; if(!a) return null; return Math.round(a.reduce((x,r)=>x+r.acc,0)/a.length);};
  const heat=(fn,lab)=>`<h3 style="margin-top:1em">${lab}</h3><div class="heat">${LETTERS.map(l=>{const v=fn(l);return `<div style="background:${pctColor(v)}">${l}<small>${v==null?"—":v+"%"}</small></div>`;}).join("")}</div>`;
  const hardest=[...new Set(recs.filter(r=>r.lvl>1).map(r=>r.area+"|"+r.item))].map(k=>{const [area,item]=k.split("|");const rs=recs.filter(r=>r.area===area&&r.item===item);
    const v=area==="lectura"?rs.filter(r=>r.tries===1).length/rs.length*100:rs.reduce((a,r)=>a+r.acc,0)/rs.length; return {area,item,v:Math.round(v),n:rs.length};}).filter(x=>x.v<70).sort((a,b)=>a.v-b.v).slice(0,10);
  body.insertAdjacentHTML("beforeend",`<div class="panel">
    <div class="row"><button class="btn small" data-backp>⬅️ Clase</button><span style="font-size:2em">${s.avatar}</span><h3 style="margin:0">${esc(s.name)}</h3>
    <span class="chip">Lectura: ${LEVELS.lectura[s.cfg.lectura]}</span><span class="chip">Escritura: ${LEVELS.escritura[s.cfg.escritura]}</span><span class="chip">${FONTS[s.cfg.font].label}</span></div>
    <div class="two" style="margin-top:1em">
      <div class="panel" style="background:#FAF8FF;margin:0"><div class="muted">Días de uso</div><div style="font-size:2em;font-weight:700">${sm.days}</div></div>
      <div class="panel" style="background:#FAF8FF;margin:0"><div class="muted">Lectura · aciertos a la primera</div><div style="font-size:2em;font-weight:700">${sm.lect==null?"—":sm.lect+" %"}</div><small class="muted">${sm.nL} ejercicios</small></div>
      <div class="panel" style="background:#FAF8FF;margin:0"><div class="muted">Escritura · precisión media</div><div style="font-size:2em;font-weight:700">${sm.escr==null?"—":sm.escr+" %"}</div><small class="muted">${sm.nE} ejercicios</small></div>
    </div></div>
  <div class="panel"><h3>Evolución semanal</h3>
    <div class="legend"><span><i style="background:#6C4AB6"></i>Lectura (aciertos a la primera)</span><span><i style="background:#2E9E8F"></i>Escritura (precisión)</span></div>
    <svg viewBox="0 0 ${Wd} ${Hd}" style="width:100%;max-width:${Wd*1.4}px">${grid}${bars}</svg>
    ${recs.length?"":`<p class="empty">Todavía no hay actividad registrada.</p>`}</div>
  <div class="panel">${heat(cellL,"Reconocimiento de letras (lectura)")}${heat(cellE,"Trazado de letras (escritura)")}
    <div class="legend"><span><i style="background:#CDEFD9"></i>80 % o más</span><span><i style="background:#FBE7C2"></i>50–79 %</span><span><i style="background:#F8D3D1"></i>menos de 50 %</span><span><i style="background:#EEEAF4"></i>sin datos</span></div></div>
  ${hardest.length?`<div class="panel"><h3>Lo que más le cuesta (sílabas, palabras y frases)</h3>${hardest.map(x=>`<span class="chip" style="background:${pctColor(x.v)};color:var(--ink)">${x.area==="lectura"?"👀":"✏️"} ${esc(x.item)} · ${x.v} %</span>`).join(" ")}</div>`:""}
  <div class="panel"><h3>Actividad reciente</h3>${recs.length?`<div class="tw"><table><thead><tr><th>Fecha</th><th>Área</th><th>Nivel</th><th>Ejercicio</th><th>Intentos</th><th>Resultado</th></tr></thead><tbody>
    ${recs.slice(-15).reverse().map(r=>`<tr><td>${new Date(r.t).toLocaleString("es-ES",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</td><td>${r.area==="lectura"?"👀 Lectura":"✏️ Escritura"}</td><td>${LEVELS[r.area][r.lvl]}</td><td><b>${esc(r.item)}</b></td><td>${r.tries}</td><td>${r.acc} %</td></tr>`).join("")}
  </tbody></table></div>`:`<div class="empty">Sin actividad.</div>`}</div>`);
  body.querySelector("[data-backp]").onclick=()=>{S.tStudent=null;teacherPanel();};
}

/* ---- Copias de seguridad ---- */
function tabBackup(body){
  const gs=myGroups();
  body.innerHTML=`<div class="panel"><h3>Hacer copia de seguridad</h3>
    <p class="muted">Guarda un archivo con las clases, el alumnado y el progreso. Sirve para no perder datos y para pasar el progreso a otro equipo (por ejemplo, de la pizarra a una tablet).</p>
    <div class="row"><select data-bg style="padding:.5em;border-radius:10px;border:2px solid var(--line)"><option value="">${me().admin?"Todas las clases":"Todas mis clases"}</option>${gs.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join("")}</select>
    <button class="btn primary" data-exp>💾 Descargar copia</button></div></div>
  <div class="panel"><h3>Recuperar o juntar una copia</h3>
    <p class="muted">Se añaden las clases, alumnos y registros del archivo. Lo que ya existe se actualiza y no se duplica.</p>
    <input type="file" accept=".json,application/json" data-imp></div>
  ${me().admin?`<div class="panel"><h3>Zona peligrosa</h3><button class="btn danger" data-wipe>🗑️ Borrar todos los datos de este equipo</button></div>`:""}`;
  body.querySelector("[data-exp]").onclick=()=>{
    const gid=body.querySelector("[data-bg]").value;
    const groups=gid?gs.filter(g=>g.id===gid):gs; const gids=new Set(groups.map(g=>g.id));
    const students=DB.students.filter(s=>gids.has(s.group)); const sids=new Set(students.map(s=>s.id));
    const tids=new Set(groups.flatMap(g=>g.teachers||[]));
    const data={app:"lectoescritura",version:1,exported:new Date().toISOString(),teachers:DB.teachers.filter(t=>tids.has(t.id)),groups,students,records:DB.records.filter(r=>sids.has(r.st))};
    const json=JSON.stringify(data);
    const name=`lectoescritura-${gid?groups[0].name.replace(/\W+/g,"_"):"todo"}-${new Date().toISOString().slice(0,10)}.json`;
    try{
      const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([json],{type:"application/json"})); a.download=name;
      document.body.appendChild(a); a.click(); a.remove(); toast("Copia descargada: "+name);
    }catch(e){ toast("No se pudo descargar"); }
  };
  body.querySelector("[data-imp]").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result); if(d.app!=="lectoescritura") throw 0;
        const up=(arr,items)=>items.forEach(it=>{const i=arr.findIndex(x=>x.id===it.id); if(i>=0) arr[i]=Object.assign(arr[i],it); else arr.push(it);});
        // los docentes importados no sobrescriben el PIN de los existentes
        (d.teachers||[]).forEach(t=>{ if(!byId(DB.teachers,t.id)) DB.teachers.push(Object.assign({},t,{admin:DB.teachers.length?false:t.admin})); });
        up(DB.groups,d.groups||[]); up(DB.students,d.students||[]);
        const have=new Set(DB.records.map(r=>r.id)); (d.records||[]).forEach(r=>{ if(!have.has(r.id)) DB.records.push(r); });
        save(); toast(`Copia recuperada: ${(d.students||[]).length} alumnos, ${(d.records||[]).length} registros`); teacherPanel();
      }catch(err){ toast("El archivo no es una copia válida"); }
    }; rd.readAsText(f);
  };
  const w=body.querySelector("[data-wipe]"); if(w) w.onclick=()=>confirmBox("¿Borrar TODOS los datos de este equipo? Haz antes una copia.","Borrar todo",()=>{DB=blankDB();save();S.teacherId=null;screenGroups();});
}

/* ---- Ajustes del equipo ---- */
function tabSettings(body){
  const cur=DB.settings.celebration||"confeti";
  const opts=[["confeti","Animación con confeti","Estrellas y globos caen por la pantalla al acertar."],
              ["check","Solo una marca ✓","Aparece un ✓ verde grande y desaparece. Sin movimiento por la pantalla."],
              ["nada","Sin animaciones","Solo cambia de color la respuesta o el trazo. Lo más tranquilo."]];
  body.innerHTML=`<div class="panel"><h3>Celebración al acertar</h3>
    <p class="muted" style="margin-top:0">Se aplica a todas las clases en este equipo. El «modo tranquilo» de cada alumno sigue funcionando aunque aquí elijas confeti.</p>
    ${opts.map(([k,t,d])=>`<label class="settings-opt ${cur===k?"on":""}"><input type="radio" name="cel" value="${k}" ${cur===k?"checked":""}><span><b>${t}</b><span class="muted">${d}</span></span></label>`).join("")}
    <div class="row" style="margin-top:.4em"><button class="btn small" data-test>👀 Probar</button></div></div>
  <div class="panel"><h3>Voz de ánimo</h3>
    <label class="settings-opt ${DB.settings.praise!==false?"on":""}"><input type="checkbox" data-praise ${DB.settings.praise!==false?"checked":""}><span><b>Decir «¡Muy bien!» al acertar</b><span class="muted">Si lo desactivas, la voz solo lee los enunciados (letras, sílabas, palabras).</span></span></label></div>`;
  body.querySelectorAll("input[name=cel]").forEach(r=>r.onchange=()=>{DB.settings.celebration=r.value; save(); tabSettings(body); toast("Guardado");});
  body.querySelector("[data-praise]").onchange=e=>{DB.settings.praise=e.target.checked; save(); tabSettings(body); toast("Guardado");};
  body.querySelector("[data-test]").onclick=()=>{ celebrate(); praise(["¡Muy bien!"]); };
}

/* ---- Docentes ---- */
function tabTeachers(body){
  body.innerHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Docentes</h3><button class="btn primary" data-new>➕ Nuevo docente</button></div>
  ${DB.teachers.map(t=>`<div class="list-item"><span class="av">👩‍🏫</span><div class="grow"><b>${esc(t.name)}</b> ${t.admin?`<span class="chip">Administración</span>`:""}
    <div class="muted" style="font-size:.85em">${DB.groups.filter(g=>(g.teachers||[]).includes(t.id)).map(g=>esc(g.name)).join(", ")||"Sin clases asignadas"}</div></div>
    <button class="btn small" data-pin="${t.id}">Cambiar PIN</button>${t.id!==S.teacherId?`<button class="btn small" data-del="${t.id}">Eliminar</button>`:""}</div>`).join("")}</div>
  <p class="muted" style="padding:0 .5em">Las clases se comparten desde «Clases → Editar»: marca qué docentes pueden verlas (por ejemplo, tutora + PT + AL).</p>`;
  const form=(t)=>modal(`<h3>${t?"Cambiar PIN de "+esc(t.name):"Nuevo docente"}</h3><div class="form">
    ${t?"":`<label>Nombre<input type="text" data-n></label><label class="check"><input type="checkbox" data-adm> Administración (ve todas las clases)</label>`}
    <label>PIN de 4 cifras<input type="password" inputmode="numeric" maxlength="4" data-p></label></div>
    <div class="row end"><button class="btn" data-x>Cancelar</button><button class="btn primary" data-ok>Guardar</button></div>`,(m,close)=>{
      m.querySelector("[data-x]").onclick=close;
      m.querySelector("[data-ok]").onclick=()=>{
        const p=m.querySelector("[data-p]").value.trim(); if(!/^\d{4}$/.test(p)) return toast("El PIN debe tener 4 cifras");
        if(t){ t.pin=p; } else { const n=m.querySelector("[data-n]").value.trim(); if(!n) return toast("Escribe el nombre"); DB.teachers.push({id:uid(),name:n,pin:p,admin:m.querySelector("[data-adm]").checked}); }
        save(); close(); teacherPanel();
      };
    });
  body.querySelector("[data-new]").onclick=()=>form(null);
  body.querySelectorAll("[data-pin]").forEach(b=>b.onclick=()=>form(byId(DB.teachers,b.dataset.pin)));
  body.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const t=byId(DB.teachers,b.dataset.del); confirmBox(`¿Eliminar a ${t.name}? Sus clases se mantienen.`,"Eliminar",()=>{
    DB.teachers=DB.teachers.filter(x=>x.id!==t.id); DB.groups.forEach(g=>g.teachers=(g.teachers||[]).filter(x=>x!==t.id)); save(); teacherPanel(); });});
}
