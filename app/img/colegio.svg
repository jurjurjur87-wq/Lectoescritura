  <rect x="340" y="193" width="460" height="10" fill="#A8976F"/>
  <rect x="420" y="208" width="110" height="54" fill="#3F4852"/>
  <path d="M447 208V262M475 208V262M503 208V262" stroke="#6E7883" stroke-width="2"/>
  <rect x="560" y="214" width="70" height="30" fill="#59646F"/><rect x="660" y="214" width="70" height="30" fill="#59646F"/>
  <rect x="340" y="186" width="460" height="9" fill="#F7EBC2"/>
  <!-- carteles -->
  <rect x="372" y="166" width="70" height="18" rx="2" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/>
  <rect x="375" y="169" width="14" height="12" fill="#2E7D4F"/><path d="M393 172H437M393 177H430" stroke="#2E7D4F" stroke-width="2"/>
  <rect x="448" y="168" width="34" height="15" rx="2" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5"/>
  <!-- banderas -->
  <path class="ns" d="M398 166 L404 130 M410 166 L416 130 M422 166 L428 130" stroke="#8C8C8C" stroke-width="2"/>
  <path class="ns" d="M404 131 L398 139 L396 160 L402 150Z" fill="#2B4C9B"/>
  <path class="ns" d="M416 131 L410 139 L408 160 L414 150Z" fill="#E7C02F"/><path class="ns" d="M416 131 L413 135 L410 157 L412 153Z" fill="#C8352B"/>
  <path class="ns" d="M428 131 L422 139 L420 160 L426 150Z" fill="#F7F7F7"/><path class="ns" d="M428 131 L425 135 L422 157 L424 153Z" fill="#1E8A4C"/>

  <!-- pilares -->
  <g fill="#F5A623">
    <rect x="255" y="74" width="18" height="188"/>
    <rect x="345" y="74" width="22" height="114"/><rect x="545" y="74" width="22" height="188"/>
    <rect x="785" y="74" width="22" height="188"/><rect x="1005" y="74" width="22" height="188"/>
    <rect x="1162" y="74" width="18" height="188"/>
