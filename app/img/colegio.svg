</g>
<g stroke="#2E2A3B" stroke-width="3"><circle cx="1110" cy="42" r="26" fill="#FFD34D"/></g>
<g fill="#2E2A3B"><circle cx="1101" cy="38" r="3"/><circle cx="1119" cy="38" r="3"/></g><path d="M1100 49 Q1110 57 1120 49" stroke="#2E2A3B" stroke-width="3" fill="none" stroke-linecap="round"/>
