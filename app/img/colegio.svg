  <!-- ventanas plantas 1.ª y 2.ª -->
  <g>
    <use href="#ventana" x="270" y="88" width="56" height="34"/>
    <use href="#ventana" x="378" y="88" width="60" height="36"/><use href="#ventana" x="460" y="88" width="60" height="36"/>
    <use href="#ventana" x="590" y="88" width="60" height="36"/><use href="#ventana" x="690" y="88" width="60" height="36"/>
    <use href="#ventana" x="830" y="88" width="60" height="36"/><use href="#ventana" x="925" y="88" width="60" height="36"/>
    <use href="#ventana" x="1040" y="88" width="60" height="36"/>
    <use href="#ventana" x="270" y="144" width="56" height="34"/>
    <use href="#ventana" x="460" y="144" width="60" height="36"/>
    <use href="#ventana" x="590" y="144" width="60" height="36"/><use href="#ventana" x="690" y="144" width="60" height="36"/>
    <use href="#ventana" x="830" y="144" width="60" height="36"/><use href="#ventana" x="925" y="144" width="60" height="36"/>
    <use href="#ventana" x="1040" y="144" width="60" height="36"/>
