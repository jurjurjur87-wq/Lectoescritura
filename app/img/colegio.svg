  <use href="#reja" x="830" y="200" width="60" height="34"/><use href="#reja" x="925" y="200" width="60" height="34"/>
  <use href="#reja" x="1045" y="200" width="60" height="34"/>
  <rect x="255" y="238" width="90" height="20" fill="url(#azulejo)"/>
  <rect x="807" y="238" width="373" height="20" fill="url(#azulejo)"/>
  <rect x="345" y="226" width="22" height="32" fill="url(#azulejo)"/><rect x="545" y="226" width="22" height="32" fill="url(#azulejo)"/>
  <rect x="785" y="226" width="22" height="32" fill="url(#azulejo)"/><rect x="1005" y="226" width="22" height="32" fill="url(#azulejo)"/>
  <rect x="255" y="257" width="925" height="5" fill="#2E7D4F"/>
  <rect x="340" y="257" width="460" height="5" fill="#A8976F"/>

  <!-- cipreses -->
