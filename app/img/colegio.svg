    <path d="M60 262 C40 230 48 170 70 128 C92 170 100 230 80 262Z" fill="#23883F"/>
    <path d="M108 262 C84 220 92 150 120 100 C146 150 152 220 132 262Z" fill="#1C6E36"/>
    <path d="M160 262 C132 215 142 130 172 76 C202 130 210 215 186 262Z" fill="#1F7A3D"/>
    <path d="M214 262 C186 210 196 110 228 52 C260 110 268 210 242 262Z" fill="#2A9447"/>
    <path class="ns" d="M228 60 C246 110 250 200 236 262" stroke="#4B7E55" stroke-width="5" fill="none" opacity=".6"/>
    <path class="ns" d="M172 84 C188 130 192 210 180 262" stroke="#4B7E55" stroke-width="4" fill="none" opacity=".6"/>
  </g>

  <!-- naranjos -->
  <g>
    <rect x="828" y="252" width="66" height="12" fill="#B5563A"/>
    <path class="ns" d="M858 254 C856 225 852 205 842 186 M856 220 C866 205 878 196 892 188 M852 205 C838 196 826 192 812 190" stroke="#6B4A33" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g fill="#4CB04A"><circle cx="820" cy="180" r="34"/><circle cx="870" cy="160" r="40"/><circle cx="905" cy="185" r="28"/><circle cx="845" cy="135" r="26"/></g>
    <g fill="#7ED957" opacity=".8"><circle cx="860" cy="150" r="20"/><circle cx="828" cy="172" r="16"/></g>
    <g fill="#F2A23A"><circle cx="812" cy="170" r="5"/><circle cx="850" cy="182" r="5"/><circle cx="880" cy="150" r="5"/><circle cx="898" cy="190" r="5"/><circle cx="838" cy="140" r="4.5"/><circle cx="866" cy="198" r="4.5"/><circle cx="905" cy="168" r="4.5"/></g>
    <g fill="#4CB04A"><circle cx="1195" cy="175" r="40"/><circle cx="1165" cy="150" r="26"/></g>
    <g fill="#F2A23A"><circle cx="1172" cy="160" r="5"/><circle cx="1188" cy="190" r="5"/></g>
