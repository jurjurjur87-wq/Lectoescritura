<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Dibujo del colegio">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9DFF3"/><stop offset="1" stop-color="#F1F6FB"/></linearGradient>
    <pattern id="azulejo" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#FBFBFD"/>
      <path d="M7 1 L13 7 L7 13 L1 7Z" fill="none" stroke="#3E63A8" stroke-width="1.6"/>
      <circle cx="7" cy="7" r="1.6" fill="#3E63A8"/>
    </pattern>
    <pattern id="persiana" width="8" height="5" patternUnits="userSpaceOnUse">
      <rect width="8" height="5" fill="#F4F1EA"/><rect y="4" width="8" height="1" fill="#DDD7CB"/>
    </pattern>
    <pattern id="losas" width="40" height="20" patternUnits="userSpaceOnUse">
      <rect width="40" height="20" fill="#E7E4DE"/><path d="M0 0.5H40M0.5 0V20" stroke="#D3CFC7" stroke-width="1"/>
    </pattern>
    <symbol id="ventana" viewBox="0 0 60 36">
      <rect width="60" height="36" rx="2" fill="#FFFFFF"/>
      <rect x="3" y="3" width="54" height="17" fill="url(#persiana)"/>
      <rect x="3" y="20" width="26" height="13" fill="#5E7183"/><rect x="31" y="20" width="26" height="13" fill="#6C8092"/>
      <path d="M6 22 L14 22 L8 31Z" fill="#8FA3B5" opacity=".6"/>
    </symbol>
    <symbol id="reja" viewBox="0 0 60 34">
      <rect width="60" height="34" fill="#55606B"/>
      <path d="M6 0V34M13 0V34M20 0V34M27 0V34M34 0V34M41 0V34M48 0V34M55 0V34M0 11H60M0 23H60" stroke="#8B5A3C" stroke-width="2"/>
    </symbol>
  </defs>
<style>#scene rect:not(.ns),#scene path:not(.ns),#scene circle{stroke:#2E2A3B;stroke-width:3;stroke-linejoin:round}#scene ellipse{stroke:none}</style><g id="scene">

  <!-- cielo, nubes y monte -->
  <rect class="ns" width="1200" height="320" fill="url(#sky)"/>
  <g fill="#FFFFFF" opacity=".9">
