    <ellipse cx="620" cy="28" rx="110" ry="18"/><ellipse cx="700" cy="20" rx="60" ry="15"/>
    <ellipse cx="1050" cy="36" rx="80" ry="16"/>
  </g>
  <path d="M0 240 Q60 205 130 222 T260 232 L260 262 L0 262Z" fill="#B7C4BE"/>

  <!-- suelo -->
  <rect class="ns" y="258" width="1200" height="62" fill="url(#losas)"/>
  <path class="ns" d="M330 320 L760 262" stroke="#F0C232" stroke-width="6"/>

  <!-- edificio -->
  <rect x="255" y="74" width="925" height="188" fill="#FFE08A"/>
  <path d="M238 60 H1196 L1190 77 H246Z" fill="#E8742B"/>
  <path d="M238 60 H1196" stroke="#A9692C" stroke-width="4"/>
  <rect x="255" y="128" width="925" height="7" fill="#E4B964"/>
